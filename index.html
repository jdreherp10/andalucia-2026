<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a1120" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Andalucía 2026" />
<meta name="description" content="Plan del viaje familiar por Andalucía, 2–15 oct 2026: agenda día a día, bases y mapa de la ruta." />
<title>Andalucía 2026 · Viaje familiar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{--bg:#0a1120;--panel:#0f1a2c;--panel2:#13233b;--line:#22304a;--txt:#eef4fb;--muted:#93a4bb;--accent:#38bdf8;--gold:#e9b949;--safe-b:env(safe-area-inset-bottom,0px);--navH:0px}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
  #app{display:flex;height:100vh;height:100dvh;overflow:hidden}
  #panel{width:400px;min-width:400px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1300}
  #sheetHandle{display:none}
  #panelHead{padding:16px 20px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#12213a 0%,var(--panel) 100%)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .flag{font-size:22px}
  .brand h1{font-size:19px;margin:0;letter-spacing:.2px;font-weight:700}
  .brand .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:11.5px;color:var(--muted)}
  .stat b{color:var(--txt);font-weight:700}
  .seg{display:flex;gap:4px;margin-top:13px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:1 0 auto;min-width:max-content;white-space:nowrap;border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:9px 8px;border-radius:8px;cursor:pointer;transition:.18s;font-family:inherit}
  .seg button.on{background:linear-gradient(135deg,var(--accent),#0ea5e9);color:#06263b;box-shadow:0 2px 10px rgba(56,189,248,.35)}
  #panelBody{overflow-y:auto;flex:1;padding:14px 14px calc(24px + var(--safe-b))}

  /* Bases view */
  .endpoints{display:flex;gap:8px;margin-bottom:10px}
  .ep{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
  .ep .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;align-items:center;gap:5px}
  .ep .val{font-size:13.5px;font-weight:700;margin-top:3px}
  .ep .day{font-size:11px;color:var(--muted);margin-top:1px}
  .note{display:flex;gap:9px;align-items:flex-start;border-radius:11px;padding:10px 12px;font-size:12px;line-height:1.5;margin-bottom:11px}
  .note.luggage{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.28);color:#bfe6fb}
  .note.warn{background:rgba(233,185,73,.08);border:1px solid rgba(233,185,73,.28);color:#f0dca6;margin-bottom:16px}
  .note .ic{font-size:14px}
  .sectionlbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:2px 4px 10px;font-weight:700}
  .basecard{position:relative;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:13px;padding:13px 14px 14px;margin-bottom:11px;cursor:pointer;transition:.18s}
  .basecard:hover{transform:translateY(-1px);border-color:var(--c);box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .bhead{display:flex;align-items:center;gap:11px}
  .bnum{width:30px;height:30px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#08111f;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
  .btitle{font-size:15px;font-weight:700}.bmeta{font-size:11.5px;color:var(--muted);margin-top:1px}.bmeta b{color:var(--c)}
  .btag{font-size:9.5px;font-weight:700;color:var(--gold);border:1px solid rgba(233,185,73,.4);border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:middle}
  .bblurb{font-size:12px;color:var(--muted);line-height:1.5;margin:9px 0 10px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 9px;color:var(--txt);cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:4px}
  .chip:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--bg))}
  .chip .sg{color:var(--gold);font-size:9px}
  .stops{display:flex;flex-wrap:wrap;gap:6px;margin:10px 4px 4px}
  .stopchip{font-size:11px;background:rgba(233,185,73,.08);border:1px dashed rgba(233,185,73,.45);border-radius:20px;padding:4px 9px;color:#f0dca6;cursor:pointer}
  .toggles{display:flex;flex-direction:column;gap:9px;margin-top:6px;padding:13px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:13px}
  .toggles .tlbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
  .toggles label{display:flex;align-items:center;gap:9px;font-size:12.5px;cursor:pointer}
  .toggles input{accent-color:var(--accent);width:16px;height:16px}

  /* Agenda view */
  .pills{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .pill{flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:7px 11px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s}
  .pill:hover{border-color:var(--accent)}
  .pill.on{background:linear-gradient(135deg,var(--accent),#0ea5e9);color:#06263b;border-color:transparent}
  .pill .pd{width:7px;height:7px;border-radius:50%}
  .pill.on .pd{display:none}
  .g{background:#4ade80}.y{background:#e9b949}.r{background:#fb7185}
  .ddhd{display:flex;align-items:center;gap:10px;padding:2px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:13px}
  .ddhd .ddt{font-size:18px;font-weight:800}
  .ddhd .ddb{font-size:12px;color:var(--muted);margin-top:2px}
  .ddhd .sp{margin-left:auto}
  .loadpill{font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
  .load-g{background:rgba(74,222,128,.16);color:#86efac}
  .load-y{background:rgba(233,185,73,.16);color:#f0dca6}
  .load-r{background:rgba(251,113,133,.16);color:#fda4af}
  .place{display:flex;gap:11px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:9px;margin-bottom:9px;cursor:pointer;transition:.15s}
  .place:hover{border-color:var(--c);transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.32)}
  .pthumb{position:relative;width:88px;height:88px;flex:none;border-radius:11px;overflow:hidden;background:linear-gradient(135deg,#1e2f49,#0f1a2c);display:flex;align-items:center;justify-content:center}
  .pthumb .pemoji{font-size:28px;opacity:.5}
  .pthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s}
  .pthumb img.on{opacity:1}
  .pbody{flex:1;min-width:0;padding:4px 3px 2px}
  .ptime{font-size:10.5px;font-weight:800;color:var(--accent);background:rgba(56,189,248,.12);padding:2px 8px;border-radius:20px}
  .pname{font-size:13.5px;font-weight:700;margin-top:6px;line-height:1.3}
  .pdesc{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
  .logi{display:flex;align-items:center;gap:10px;padding:5px 8px 5px 4px;font-size:12px;color:var(--muted)}
  .logi .ltime{font-size:10.5px;font-weight:800;color:#7f93ad;min-width:44px}
  .logi .lic{font-size:12px;width:16px;text-align:center}
  .resv{margin-top:2px;margin-bottom:10px;font-size:11.5px;color:#f0dca6;background:rgba(233,185,73,.08);border:1px solid rgba(233,185,73,.28);border-radius:10px;padding:8px 11px;display:flex;gap:8px}
  .ddnav{display:flex;gap:8px;margin-top:12px}
  .ddnav button{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:10px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
  .ddnav button:hover:not(:disabled){border-color:var(--accent)}
  .ddnav button:disabled{opacity:.32;cursor:default}

  /* Map */
  #mapWrap{flex:1;position:relative;height:100vh;height:100dvh}
  #map{position:absolute;inset:0}
  .leaflet-container{background:#081019;font-family:inherit}
  .pin{width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid rgba(255,255,255,.92);box-shadow:0 3px 8px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
  .pin span{transform:rotate(45deg);font-size:15px;line-height:1}
  .pin.sug{border-style:dashed;border-color:#ffe08a}.pin.stop{border-style:dashed;border-color:#f4d58a}
  .basemk{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#08111f;border:3px solid rgba(255,255,255,.92);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 32%,transparent),0 3px 9px rgba(0,0,0,.5)}
  .airmk{padding:4px 9px;border-radius:10px;background:#14243a;border:1.5px solid var(--accent);color:#dcefff;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.55);display:flex;align-items:center;gap:5px}
  .airmk .role{font-size:9px;text-transform:uppercase;color:#7fd0ff}
  .timelabel{background:#0e1a2b;border:1px solid #34506b;color:#cfe3f5;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.45)}
  .timelabel.ferry{border-color:var(--accent);color:#9fd0ff;background:#0c1a2a}
  .leaflet-popup-content-wrapper{background:var(--panel2);color:var(--txt);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .leaflet-popup-content{margin:12px 14px}.leaflet-popup-tip{background:var(--panel2)}
  .popimg{width:100%;height:120px;border-radius:9px;overflow:hidden;margin-bottom:8px;background:linear-gradient(135deg,#1e2f49,#0f1a2c);position:relative}
  .popimg img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s}
  .popimg img.on{opacity:1}
  .pop h4{margin:0 0 5px;font-size:15px}
  .pop .ztag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;color:#08111f;font-weight:700;margin-bottom:7px}
  .pop .row{font-size:12.5px;margin:4px 0}.pop .row b{color:var(--accent)}
  .pop .desc{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}
  .legend{position:absolute;z-index:1000;bottom:16px;right:16px;background:rgba(12,20,34,.9);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:11.5px;backdrop-filter:blur(6px)}
  .legend .row{display:flex;align-items:center;gap:8px;margin:4px 0;color:var(--muted)}
  .legend .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .legend .ln{width:16px;height:0;border-top:3px solid var(--accent);flex:none}.legend .ln.dash{border-top:2px dashed #2dd4bf}
  /* ===== Táctil: respuesta al dedo en todo lo que se toca ===== */
  button,a,.chip,.pill,.gchip,.stopchip,.basecard,.place,.tab,.erow .edel,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  button:active,.chip:active,.pill:active,.gchip:active,.stopchip:active,.stchoose:active,.rgoto:active,.gadd:active,.tab:active,summary:active{transform:scale(.97)}
  .basecard:active,.place:active,.stcard:active{transform:scale(.99)}
  .gchip,.pill,.chip,.stopchip,.tab{user-select:none;-webkit-user-select:none}

  /* ===== Barra de pestañas inferior (solo móvil) ===== */
  #tabbar{display:none}
  .tab{border:0;background:transparent;color:var(--muted);font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 1px;font-size:9.5px;font-weight:700;cursor:pointer;letter-spacing:-.01em;transition:color .15s}
  .tab .ti{font-size:20px;line-height:1;transition:transform .2s}
  .tab.on{color:var(--accent)}
  .tab.on .ti{transform:translateY(-2px) scale(1.08)}
  .tab.on::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--accent)}

  /* ===== Avisos flotantes ===== */
  #toast{position:fixed;left:50%;bottom:calc(var(--navH) + 18px);transform:translate(-50%,16px);z-index:3000;background:#1b2c46;border:1px solid var(--line);color:var(--txt);font-size:13px;font-weight:600;padding:11px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  #toast.bad{border-color:rgba(251,113,133,.5);color:#fda4af}

  /* ===== Formularios plegables (la lista manda, el formulario se abre a demanda) ===== */
  .fold{background:var(--panel2);border:1px solid var(--line);border-radius:13px;margin-bottom:14px;overflow:hidden}
  .fold>summary{list-style:none;cursor:pointer;padding:14px;font-size:13.5px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
  .fold>summary::-webkit-details-marker{display:none}
  .fold>summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .2s}
  .fold[open]>summary::after{transform:rotate(180deg)}
  .fold[open]>summary{border-bottom:1px solid var(--line)}
  .fold .gform{margin:0;border:0;border-radius:0;background:transparent}

  /* ===== Vista móvil: mapa a pantalla completa + hoja deslizable + tabbar ===== */
  @media(max-width:820px){
    :root{--navH:calc(56px + var(--safe-b))}
    #app{flex-direction:column}
    #mapWrap{position:fixed;inset:0;height:100dvh}
    #panel{position:fixed;left:0;right:0;bottom:var(--navH);top:auto;width:100%;min-width:0;height:min(86dvh,760px);border-right:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.6);transform:translateY(var(--ty,80%));transition:transform .3s cubic-bezier(.32,.72,0,1);will-change:transform}
    #panel.dragging{transition:none}
    #sheetHandle{display:flex;justify-content:center;align-items:center;padding:10px 0 2px;cursor:grab;flex-direction:column;gap:5px;touch-action:none}
    #sheetHandle .grab{width:44px;height:5px;border-radius:3px;background:#3a4f6b;transition:background .2s}
    #panel.dragging #sheetHandle .grab{background:var(--accent)}
    #sheetHandle .hint{display:none}
    #panelHead{padding:6px 16px 10px;touch-action:none}
    #panelHead .stats,#panelHead .seg{display:none}
    .brand h1{font-size:16px}.brand .sub{font-size:11px}
    #panelBody{padding:12px 13px 26px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
    .legend{display:none}
    #tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:1600;background:rgba(8,14,26,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
    .tab{position:relative;min-height:56px}
    /* dedos, no punteros: todo lo que se toca crece */
    .gform input{font-size:16px;padding:13px 12px}  /* 16px evita el zoom automático de iOS */
    .gform label{font-size:11px}
    .gchip{padding:10px 14px;font-size:13px}
    .mtx th,.mtx td{padding:13px 9px}
    .chip,.stopchip{padding:8px 13px;font-size:12px}
    .pill{padding:10px 14px;font-size:12.5px}
    .ddnav button{padding:14px 10px;font-size:13px}
    .gadd{padding:15px;font-size:15px}
    .stchoose,.rgoto,.gbtns button{padding:13px;font-size:13px}
    .stdel,.erow .edel{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:10px}
    .stcard .stdel{top:6px;right:6px}
    .stlink,.stinvite{padding:12px 14px;font-size:13px}
    .toggles label{padding:6px 0;font-size:13.5px}
    .toggles input{width:20px;height:20px}
    .basecard{padding:15px 15px 16px}
    .place{padding:10px}
    /* cabecera de día pegajosa: siempre sabes qué día estás mirando */
    .ddhd{position:sticky;top:0;z-index:5;background:var(--panel);margin:0 -13px 13px;padding:10px 13px 12px}
    .pills{position:sticky;top:0;z-index:6;background:var(--panel);margin:0 -13px;padding:2px 13px 10px}
    .ddhd{top:52px}
  }
  @media(max-width:820px) and (display-mode:standalone){#panel{height:min(88dvh,800px)}}
  /* ===== Auto-relleno del link de un anuncio ===== */
  .urlrow{display:flex;gap:6px;align-items:stretch}
  .urlrow input{flex:1;min-width:0}
  .sfill{flex:0 0 auto;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.4);color:var(--accent);border-radius:9px;padding:0 12px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
  .sfill:hover:not(:disabled){background:rgba(56,189,248,.22)}
  .sfill:disabled{opacity:.55;cursor:default}
  .sfillmsg{font-size:11px;line-height:1.45;margin-top:6px;display:none}
  .sfillmsg.on{display:block}
  .sfillmsg.ok{color:#86efac}
  .sfillmsg.warn{color:#fda4af}
  .sfillmsg.busy{color:var(--muted)}
  /* ===== Deslizar entre días / pestañas ===== */
  #panelBody.swipe-l{animation:swl .22s ease}
  #panelBody.swipe-r{animation:swr .22s ease}
  @keyframes swl{from{opacity:.25;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes swr{from{opacity:.25;transform:translateX(-26px)}to{opacity:1;transform:none}}
  .swipehint{display:none}
  @media(max-width:820px){.swipehint{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;color:var(--muted);font-weight:600;padding:2px 0 10px;opacity:.75}}
  /* Gastos */
  .gsummary{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .ucard{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:10px 13px}
  .ucard .uname{font-size:13px;font-weight:700}
  .ucard .ubal{font-size:19px;font-weight:800;margin-top:2px}
  .ucard .ubal.pos{color:#4ade80}.ucard .ubal.neg{color:#fb7185}.ucard .ubal.zero{color:var(--muted)}
  .ucard .ulbl{font-size:11px;color:var(--muted)}
  .ucard .upaid{font-size:10.5px;color:var(--muted);margin-top:4px}
  .settlebox{background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.25);border-radius:12px;padding:11px 13px;margin-bottom:16px}
  .settlebox .st{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:6px}
  .settle{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 0}
  .settle span{margin-left:auto;font-weight:800;color:#7fd0ff}
  .settle.ok{color:#86efac}
  .gform{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:14px;display:flex;flex-direction:column;gap:11px}
  .gform label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
  .gform input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;color:var(--txt);font-size:14px;font-family:inherit}
  .gform input:focus{outline:none;border-color:var(--accent)}
  .chrow{display:flex;gap:6px;flex-wrap:wrap}
  .gchip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:6px 11px;font-size:12px;color:var(--muted);cursor:pointer;font-weight:600;user-select:none}
  .gchip.on{background:color-mix(in srgb,var(--accent) 20%,var(--bg));border-color:var(--accent);color:var(--txt)}
  .paychip.on{background:var(--c);border-color:transparent;color:#08111f}

<script>
/* ============ Utilidades de interfaz (pensadas para el dedo) ============ */
/* Aviso flotante: reemplaza a alert() para no bloquear el pulgar en el celular. */
function toast(msg,bad){
  const t=document.getElementById('toast');if(!t)return;
  t.textContent=msg;t.className=bad?'on bad':'on';
  clearTimeout(toast._t);toast._t=setTimeout(()=>{t.className=bad?'bad':'';},2800);
}
function copyTxt(txt,msg){
  const done=()=>toast(msg||'Copiado ✓');
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('No se pudo copiar',true);}document.body.removeChild(ta);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(fallback);
  else fallback();
}

/* ============ Reparto entre núcleos ============
   Tres bolsillos que se liquidan. Pili y Pilo no pagan: lo suyo se reparte.
   Regla 1: los gastos de la abuela Pili van mitad Johan / mitad Peter.
   Regla 2: los de la abuela Pilo, mitad Johan / mitad Klaus.
   Regla 3: en hospedaje Elina cuenta 0,25 (duerme en la cama de sus papás) -> 7,25 puestos. */
const UNITS=[
  {id:'A',name:'Johan & Christel',short:'J&C',color:'#a78bfa'},
  {id:'B',name:'Peter & Sofía',short:'P&S',color:'#fb7185'},
  {id:'K',name:'Klaus',short:'Klaus',color:'#2dd4bf'},
];
const PEOPLE=[
  {id:'johan',name:'Johan',w:{A:1}},
  {id:'christel',name:'Christel',w:{A:1}},
  {id:'elina',name:'Elina',w:{A:1}},
  {id:'peter',name:'Peter',w:{B:1}},
  {id:'sofia',name:'Sofía',w:{B:1}},
  {id:'klaus',name:'Klaus',w:{K:1}},
  {id:'pili',name:'Abuela Pili',w:{A:0.5,B:0.5}},
  {id:'pilo',name:'Abuela Pilo',w:{A:0.5,K:0.5}},
];
/* En Andalucía los 8 salen juntos en la van desde Madrid, así que nadie llega tarde.
   Si alguno se incorporase después, basta añadirlo aquí (p.ej. {peter:4}) y el reparto se ajusta solo. */
const DIA_IN=2, DIA_OUT=15;
const LLEGA={};
const llegaDe=pid=>LLEGA[pid]||DIA_IN;
function cw(pid,cat){return (pid==='elina'&&cat==='hospedaje')?0.25:1;}
function presencia(pid,cat,base){
  const ll=llegaDe(pid);
  if(ll<=DIA_IN)return 1;
  if(cat==='carro'){const tot=DIA_OUT-DIA_IN;return Math.max(0,DIA_OUT-ll)/tot;}
  if(cat==='hospedaje'&&base&&sched[base]){
    const sc=sched[base];let pres=0;
    for(let d=sc.from;d<=sc.to;d++)if(d>=ll)pres++;
    return pres/sc.n;
  }
  return 1;
}
const pesoDe=(pid,cat,base)=>cw(pid,cat)*presencia(pid,cat,base);
function repartir(amount,cat,base,forWhom){
  const out={A:0,B:0,K:0};
  const who=(forWhom&&forWhom.length)?forWhom:PEOPLE.map(p=>p.id);
  const ws=who.map(pid=>pesoDe(pid,cat,base));
  const tot=ws.reduce((a,b)=>a+b,0);
  if(!(tot>0)||!(amount>0))return out;
  who.forEach((pid,i)=>{
    const pe=PEOPLE.find(x=>x.id===pid);if(!pe)return;
    const share=amount*ws[i]/tot;
    for(const u in pe.w)out[u]+=share*pe.w[u];
  });
  return out;
}
const STAYHEADS=PEOPLE.reduce((t,p)=>t+cw(p.id,'hospedaje'),0); /* 7,25 */
const TAXHEADS=PEOPLE.length; /* personas físicas, para tasas por persona */

async function loadFX(){

}

const EXTRA_ETQ={tasa:{ic:'🏛️',n:'Tasa turística'},limpieza:{ic:'🧹',n:'Limpieza'},ropa:{ic:'🛏️',n:'Ropa de cama'},consumo:{ic:'💡',n:'Consumos'},deposito:{ic:'🔐',n:'Depósito'},efectivo:{ic:'💵',n:'Pago en efectivo'}};
const UNI_TXT={persona_noche:'/pers./noche',persona:'/persona',noche:'/noche',semana:'/semana',estancia:''};
/* Coste de un extra según su unidad. Los depósitos NO son coste: se devuelven. */
function extraCost(x,ng){
  if(!x||x.cat==='deposito'||x.monto==null)return 0;
  const m=Number(x.monto);if(isNaN(m))return 0;
  switch(x.unidad){
    case 'persona_noche':return m*TAXHEADS*ng;
    case 'persona':return m*TAXHEADS;
    case 'noche':return m*ng;
    case 'semana':return m*Math.ceil(ng/7);
    default:return m;
  }
}
function extrasTotal(s,ng){return (s.extras||[]).reduce((t,x)=>t+extraCost(x,ng),0);}
function depositosTotal(s){return (s.extras||[]).filter(x=>x.cat==='deposito'&&x.monto!=null).reduce((t,x)=>t+Number(x.monto||0),0);}
function stayMetrics(s){const ng=nightsOf(s.base);const extra=eur2usd(extrasTotal(s,ng));const total=(s.price||0)+extra;const perNight=total/ng;return{ng,extra,total,perNight,perPP:perNight/STAYHEADS};}

    const price=parseFloat(raw);

    const st={id:'s'+Date.now()+Math.floor(Math.random()*1000),base:sBase,name,url,price,rooms:numOr('sRooms'),baths:numOr('sBaths'),cap:numOr('sCap'),parking:sParking,rating:numOr('sRate'),notes:document.getElementById('sNotes').value.trim(),foto:sFoto,extras:sExtras.slice()};
    stays.push(st);sFoto=null;sExtras=[];saveS();renderPanel();body.scrollTop=0;sbIns('alojamientos',sToRow(st));toast('Casa añadida ✓');
  };
  /* Auto-relleno: la Edge Function abre el anuncio del lado del servidor y devuelve lo legible. */
  const fill=document.getElementById('sFillBtn');
  const fmsg=document.getElementById('sFillMsg');
  const setMsg=(txt,cls)=>{if(fmsg){fmsg.className='sfillmsg on '+cls;fmsg.textContent=txt;}};
  if(fill)fill.onclick=async()=>{
    const u=(document.getElementById('sUrl').value||'').trim();
    if(!u){setMsg('Pega primero el link del anuncio.','warn');return;}
    if(!sb){setMsg('Sin conexión con la nube: llena los datos a mano.','warn');return;}
    const prev=fill.textContent;
    fill.disabled=true;fill.textContent='⏳';setMsg('Abriendo el anuncio…','busy');
    let d=null,err=null;
    try{
      const invokeBody={url:u};
      /* Booking bloquea las IPs de datacenter; lo leemos desde ESTE navegador vía jina (IP residencial). */
      if(/booking\.com/i.test(u)){
        setMsg('Leyendo Booking (tarda unos segundos)…','busy');
        try{
          const ac=new AbortController();const to=setTimeout(()=>ac.abort(),28000);
          const jr=await fetch('https://r.jina.ai/'+u,{headers:{'Accept':'application/json','X-Return-Format':'markdown'},signal:ac.signal});
          clearTimeout(to);
          if(jr.ok){const jd=(await jr.json()).data;if(jd)invokeBody.prefetched={metadata:jd.metadata||{},content:(jd.content||'').slice(0,200000),title:jd.title||'',description:jd.description||''};}
        }catch(e){}
      }
      const r=await sb.functions.invoke('resumen-link',{body:invokeBody});
      if(r.error){
        try{const j=await r.error.context.json();err=j&&j.error;}catch(e){}
        if(!err)err='No se pudo leer el anuncio. Llena los datos a mano.';
      }else if(r.data&&r.data.error){err=r.data.error;}
      else d=r.data;
    }catch(e){err='No se pudo contactar el lector de links.';}
    fill.disabled=false;fill.textContent=prev;
    if(err||!d){setMsg(err||'No se pudo leer el anuncio.','warn');return;}
    const puesto=[];
    const set=(id,v,etiqueta)=>{
      if(v===null||v===undefined||v==='')return;
      const el=document.getElementById(id);
      if(el&&!el.value.trim()){el.value=String(v).replace('.',',');if(etiqueta)puesto.push(etiqueta);}
    };
    if(d.nombre){const el=document.getElementById('sName');if(el&&!el.value.trim()){el.value=d.nombre;puesto.push('nombre');}}
    set('sRate',d.rating,d.rating?`★ ${d.rating}`:null);
    set('sRooms',d.habitaciones,d.habitaciones?`${d.habitaciones} hab`:null);
    set('sBaths',d.banos,d.banos?`${d.banos} baños`:null);
    set('sCap',d.capacidad,d.capacidad?`capacidad ${d.capacidad}`:null);
    const notas=[d.camas?`${d.camas} camas`:null,d.descripcion].filter(Boolean).join(' · ');
    if(notas){const el=document.getElementById('sNotes');if(el&&!el.value.trim()){el.value=notas;puesto.push('notas');}}
    if(d.foto){sFoto=d.foto;puesto.push('foto');}
    sExtras=Array.isArray(d.tasas)?d.tasas.filter(x=>x&&x.texto):[];
    let tasaMsg='';
    if(sExtras.length){
      const ng=nightsOf(sBase);
      const costo=sExtras.reduce((t,x)=>t+extraCost(x,ng),0);
      const dep=sExtras.filter(x=>x.cat==='deposito'&&x.monto!=null).reduce((t,x)=>t+Number(x.monto||0),0);
      const partes=[];
      if(costo)partes.push(`~${usd(eur2usd(costo))} en extras (para ${TAXHEADS} pers. × ${ng} noches)`);
      if(dep)partes.push(`depósito ${usd(eur2usd(dep))} reembolsable`);
      tasaMsg=` 💶 Detecté ${partes.join(' + ')||'posibles pagos en efectivo'}: se suman al total al guardar (revísalos en el anuncio).`;
    }
    const capMala=d.capacidad!=null&&d.capacidad<8;
    const habMala=d.habitaciones!=null&&d.habitaciones<HAB_MIN;
    const base=puesto.length?`✓ ${d.fuente}: ${puesto.join(', ')}. Falta el precio: ponlo tú.`:`Leí ${d.fuente} pero los campos ya tenían datos (no los piso). El precio siempre es manual.`;
    setMsg(`${base}${capMala?` ⚠️ Capacidad ${d.capacidad}: no caben los 8.`:''}${habMala?` ⚠️ Solo ${d.habitaciones} dormitorios: hacen falta ${HAB_MIN}.`:''}${tasaMsg}`,(capMala||habMala)?'warn':'ok');
  };
  const copy=document.getElementById('sCopy');
  if(copy)copy.onclick=()=>copyTxt(document.getElementById('sJson').value,'Respaldo copiado ✓');
  const load=document.getElementById('sLoad');
  if(load)load.onclick=()=>{const t=prompt('Pega aquí el respaldo (JSON) de casas:');if(!t)return;try{const arr=JSON.parse(t);if(Array.isArray(arr)){stays=arr;saveS();renderPanel();}else toast('Formato no válido.',true);}catch(e){toast('No se pudo leer el JSON.',true);}};
}

/* ============ Presupuesto de hospedaje (proyección) ============ */
function renderPresupuesto(){
  let baseSum=0,extraSum=0,totalSum=0,depSum=0,nChosen=0;
  const nucleo={};UNITS.forEach(u=>nucleo[u.id]=0);
  const rowsHtml=ORDER.map(id=>{
    const b=BASES[id],sc=sched[id],ch=chosenFor(id);
    if(!ch) return `<div class="rcard pend" style="--c:${b.color}">
      <div class="rhead"><div class="rname">${b.name}</div><div class="rmeta">${sc.n} noche${sc.n>1?'s':''}</div></div>
      <div class="rpend">⚠️ Aún no eliges casa para esta base.</div>
      <button class="rgoto" data-goto="${id}">🏠 Elegir casa en ${b.name} →</button></div>`;
    if(!(ch.price>0)) return `<div class="rcard pend" style="--c:${b.color}">
      <div class="rhead"><div class="rname">${b.name}</div><div class="rmeta">${sc.n} noche${sc.n>1?'s':''}</div></div>
      <div class="rpend">⚠️ Elegiste «${ch.name||'(sin nombre)'}»${ch.reservada&&!ch.elegida?' (reservada)':''} pero falta el precio.</div>
      <button class="rgoto" data-goto="${id}">🏠 Poner precio en ${b.name} →</button></div>`;
    const m=stayMetrics(ch);
    const dep=eur2usd(depositosTotal(ch));
    const split=repartir(m.total,'hospedaje',id);
    baseSum+=ch.price;extraSum+=m.extra;totalSum+=m.total;depSum+=dep;nChosen++;
    UNITS.forEach(u=>nucleo[u.id]+=split[u.id]);
    const extrasRows=(ch.extras||[]).filter(x=>x&&x.cat!=='deposito').map(x=>{
      const c=extraCost(x,m.ng);if(!c)return '';
      const et=EXTRA_ETQ[x.cat]||{ic:'💶',n:'Extra en efectivo'};const ut=UNI_TXT[x.unidad]||'';
      return `<div class="stextra"><span>${et.ic} ${et.n}</span><span>${usd(eur2usd(c))}${ut?` · ${usd(eur2usd(x.monto))}${ut}`:''}</span></div>`;
    }).join('');
    const splitHtml=UNITS.map(u=>`<div class="rsp" style="--c:${u.color}"><div class="rspn">${u.short}</div><div class="rspv">${usd(split[u.id])}</div></div>`).join('');
    return `<div class="rcard" style="--c:${b.color}">
      <div class="rhead"><div class="rname">${b.name}${ch.reservada?' ✅':''}</div><div class="rmeta">${sc.n} noche${sc.n>1?'s':''}<br>${ch.name||'(sin nombre)'}</div></div>
      <div class="stextras">
        <div class="stextra"><span>🏠 Reserva</span><span>${usd(ch.price)}</span></div>
        ${extrasRows}
        <div class="stextra tot"><span>Total de la base</span><span>${usd(m.total)}</span></div>
        ${dep?`<div class="stextra dep"><span>🔐 Depósito reembolsable (aparte)</span><span>${usd(dep)}</span></div>`:''}
      </div>
      <div class="rsplit">${splitHtml}</div>
      ${ch.notes?`<div class="rnote">${ch.notes}</div>`:''}</div>`;
  }).join('');
  const ncards=UNITS.map(u=>`<div class="ucard" style="--c:${u.color}"><div class="uname">${u.name}</div>
    <div class="ubal" style="color:#cfe3f5">${usd(nucleo[u.id])}</div><div class="ulbl">le toca en hospedaje</div>
    <div class="upaid">${totalSum>0?Math.round(nucleo[u.id]/totalSum*1000)/10:0}% del total${u.id==='A'?' · Elina ¼':''}</div></div>`).join('');
  const totalBox=`<div class="settlebox"><div class="st">Total hospedaje · ${nChosen} de ${ORDER.length} bases elegidas</div>
    <div class="settle">Reservas<span>${usd(baseSum)}</span></div>
    ${extraSum?`<div class="settle">Pagos en efectivo al llegar (limpieza, consumos…)<span>${usd(extraSum)}</span></div>`:''}
    <div class="settle ok">Total a repartir<span>${usd(totalSum)}</span></div>
    ${depSum?`<div class="settle" style="color:var(--muted)">Depósitos reembolsables (no se reparten)<span>${usd(depSum)}</span></div>`:''}</div>`;
  const note=`<div class="note luggage" style="margin-bottom:11px"><span class="ic">📊</span><span>Lo que le toca a cada núcleo en <b>hospedaje</b>, <b>en USD</b>, con las casas que hayas marcado en 🏠 Casas. Reparto por <b>7,25 puestos</b>: Elina cuenta ¼ porque duerme con sus papás, y lo de las abuelas se parte (Pili entre J&C y P&S; Pilo entre J&C y Klaus). <b>Andalucía no cobra tasa turística</b>, así que aquí solo aparecen limpieza, consumos y depósitos si el anuncio los menciona.</span></div>`;
  const foot=`<div class="rfoot">Para cambiar una casa, ve a <b>🏠 Casas</b> y toca «📊 Elegir para el presupuesto» en la que quieras. Solo cuenta una por base. Los depósitos se muestran aparte porque se devuelven.</div>`;
  return note+`<div class="gsummary">${ncards}</div>`+totalBox+`<div class="sectionlbl">Desglose por base</div>`+rowsHtml+foot;
}

    return `<div class="logi"><span class="ltime">${it.t}</span><span class="lic">${KIC[it.k]||'•'}</span><span>${it.a}${it.n?` · ${it.n}`:''}</span></div>`;
  }).join('');
  const resv=RESV[agDay]?`<div class="resv"><span>⭐</span><span>${RESV[agDay]}</span></div>`:'';
  return `<div class="pills">${pills}</div>
    <div class="ddhd"><div><div class="ddt">${day.d}</div><div class="ddb">${day.bs}</div></div>
      <span class="sp"></span><span class="loadpill load-${day.load[0]}">${day.load[1]}</span></div>
    <div class="swipehint"><span>👈 desliza para cambiar de día 👉</span></div>
    ${resv}${rows}
    <div class="ddnav"><button id="dprev" ${agDay===0?'disabled':''}>← Día anterior</button><button id="dnext" ${agDay===DAYS.length-1?'disabled':''}>Día siguiente →</button></div>`;
}
/* Centra la píldora activa dentro de su tira horizontal (sin arrastrar la página). */
function centerActivePill(){
  const on=document.querySelector('#panelBody .pill.on');if(!on)return;
  const strip=on.parentElement;if(!strip)return;
  strip.scrollTo({left:Math.max(0,on.offsetLeft-(strip.clientWidth-on.offsetWidth)/2),behavior:'smooth'});
}
function renderPanel(){
  const body=document.getElementById('panelBody');
  body.innerHTML = view==='agenda'?renderAgendaView():view==='stay'?renderStays():view==='presupuesto'?renderPresupuesto():renderMapView();
  body.querySelectorAll('[data-poi]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();flyTo(el.getAttribute('data-poi'));if(window.innerWidth<=820)closeSheet();}));
  if(view==='stay'){bindStays();return;}
  if(view==='presupuesto'){bindPresupuesto();return;}
  if(view==='agenda'){
    body.querySelectorAll('.pill').forEach(el=>el.onclick=()=>{const n=+el.dataset.day;const dir=n>agDay?1:-1;agDay=n;animateSwipe(dir);renderPanel();body.scrollTop=0;});
    const pv=document.getElementById('dprev'),nx=document.getElementById('dnext');
    if(pv)pv.onclick=()=>goStep(-1);
    if(nx)nx.onclick=()=>goStep(1);
    centerActivePill();
  }else{
    document.getElementById('tgSpur').onchange=e=>{show.spur=e.target.checked;drawMap();};
    document.getElementById('tgSug').onchange=e=>{show.sug=e.target.checked;drawMap();};
    document.getElementById('tgTime').onchange=e=>{show.time=e.target.checked;drawMap();};
  }
}
document.getElementById('legend').innerHTML=
  Object.values(BASES).map(b=>`<div class="row"><span class="dot" style="background:${b.color}"></span>${b.name}</div>`).join('')
  +`<div class="row"><span class="dot" style="background:#e9b949"></span>Paradas en ruta</div>`
  +`<div class="row" style="margin-top:6px;border-top:1px solid #223049;padding-top:7px"><span class="ln"></span>Traslado en van</div>`
  +`<div class="row"><span class="ln dash"></span>Excursión de día</div>`;
/* ============ Navegación y gestos ============ */
const VIEWS=['agenda','map','stay','presupuesto'];
const panel=document.getElementById('panel');
const pbody=document.getElementById('panelBody');
const phead=document.getElementById('panelHead');
const handle=document.getElementById('sheetHandle');
const isMobile=()=>window.matchMedia('(max-width:820px)').matches;

/* ---- Hoja deslizable con tres posiciones: completa / media / asomada ---- */
let snapPx={full:0,half:0,peek:0}, snapName='full';
function measureSheet(){
  const H=panel.getBoundingClientRect().height||1;
  const peekH=(handle.offsetHeight||0)+(phead.offsetHeight||0);
  snapPx={full:0,half:Math.max(0,Math.round(H*0.46)),peek:Math.max(0,Math.round(H-peekH))};
}
function setTy(px){panel.style.setProperty('--ty',px+'px');}
function snapTo(name,quiet){
  if(!isMobile())return;
  measureSheet();
  snapName=snapPx[name]!==undefined?name:'full';
  setTy(snapPx[snapName]);
  if(!quiet)setTimeout(()=>map.invalidateSize(),340);
}
function closeSheet(){snapTo('peek');}

let drag=null,justDragged=0;
function dragEnd(){
  if(!drag)return;const d=drag;drag=null;panel.classList.remove('dragging');
  if(!d.active)return;
  justDragged=Date.now();
  let bestN=snapName,bestD=Infinity;
  for(const k in snapPx){const dd=Math.abs(snapPx[k]-d.cur);if(dd<bestD){bestD=dd;bestN=k;}}
  snapTo(bestN);
}
function attachDrag(el,fromBody){
  el.addEventListener('touchstart',e=>{
    if(!isMobile()||e.touches.length!==1||drag)return;
    if(fromBody&&e.target.closest('input,textarea,select'))return;
    measureSheet();
    const t=e.touches[0];
    drag={y0:t.clientY,x0:t.clientX,ty0:snapPx[snapName],cur:snapPx[snapName],fromBody:!!fromBody,active:false};
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!drag||e.touches.length!==1)return;
    const t=e.touches[0],dy=t.clientY-drag.y0,dx=t.clientX-drag.x0;
    if(!drag.active){
      if(Math.abs(dy)<9)return;
      if(Math.abs(dx)>Math.abs(dy)){drag=null;return;}            /* horizontal → lo maneja el swipe */
      if(drag.fromBody&&(dy<0||pbody.scrollTop>0)){drag=null;return;} /* dentro del contenido solo cierra tirando desde arriba */
      drag.active=true;panel.classList.add('dragging');
    }
    e.preventDefault();
    drag.cur=Math.max(-26,Math.min(snapPx.peek+70,drag.ty0+dy));
    setTy(drag.cur);
  },{passive:false});
  el.addEventListener('touchend',dragEnd);
  el.addEventListener('touchcancel',dragEnd);
}
attachDrag(handle,false);attachDrag(phead,false);attachDrag(pbody,true);
handle.addEventListener('click',()=>{
  if(Date.now()-justDragged<400)return;
  snapTo(snapName==='full'?'peek':'full');
});

/* ---- Cambiar de sección (barra inferior en móvil, segmentos en escritorio) ---- */
function animateSwipe(dir){
  if(!dir)return;
  pbody.classList.remove('swipe-l','swipe-r');void pbody.offsetWidth;
  pbody.classList.add(dir>0?'swipe-l':'swipe-r');
}
function setView(v,dir){
  if(!VIEWS.includes(v)||v===view)return;
  view=v;
  document.querySelectorAll('#seg button,#tabbar .tab').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  animateSwipe(dir);
  renderPanel();pbody.scrollTop=0;
  if(isMobile()){
    if(v==='map'&&snapName==='full')snapTo('half');
    else if(v!=='map'&&snapName!=='full')snapTo('full');
  }
  if(v==='map')setTimeout(()=>{map.invalidateSize();fitAll();},380);
}
document.getElementById('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.view);});
document.getElementById('tabbar').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  if(b.dataset.view===view&&isMobile()){snapTo(snapName==='full'?'peek':'full');return;} /* segundo toque: mostrar/ocultar */
  setView(b.dataset.view);
});

/* ---- Deslizar con el dedo: en Agenda cambia de día, en el resto de sección ---- */
function goStep(dir){
  if(view==='agenda'){
    const n=agDay+dir;
    if(n<0||n>DAYS.length-1){nudge(dir);return;}
    agDay=n;animateSwipe(dir);renderPanel();pbody.scrollTop=0;
  }else{
    const i=VIEWS.indexOf(view)+dir;
    if(i<0||i>VIEWS.length-1){nudge(dir);return;}
    setView(VIEWS[i],dir);
  }
}
function nudge(dir){ /* rebote suave al llegar al extremo */
  pbody.animate?pbody.animate([{transform:'none'},{transform:`translateX(${dir>0?-14:14}px)`},{transform:'none'}],{duration:220,easing:'ease-out'}):null;
}
let sw=null;
pbody.addEventListener('touchstart',e=>{
  if(e.touches.length!==1){sw=null;return;}
  if(e.target.closest('input,textarea,select,.pills,.seg,.gnote,a')){sw=null;return;}
  const t=e.touches[0];sw={x:t.clientX,y:t.clientY,t:Date.now()};
},{passive:true});
pbody.addEventListener('touchend',e=>{
  if(!sw||drag&&drag.active)return;
  const t=e.changedTouches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;
  const fast=Date.now()-sw.t<700;
  if(fast&&Math.abs(dx)>62&&Math.abs(dx)>Math.abs(dy)*1.7)goStep(dx<0?1:-1);
  sw=null;
},{passive:true});
/* Teclado en escritorio: flechas para moverse igual que el dedo */
window.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='ArrowRight')goStep(1);else if(e.key==='ArrowLeft')goStep(-1);
});

/* ---- El mapa manda: tocarlo deja la hoja asomada ---- */
map.on('click',()=>{if(isMobile()&&view==='map'&&snapName!=='peek')snapTo('peek');});
map.on('dragstart',()=>{if(isMobile()&&view==='map'&&snapName==='full')snapTo('half');});

window.addEventListener('resize',()=>{measureSheet();if(isMobile())setTy(snapPx[snapName]);map.invalidateSize();});
window.addEventListener('orientationchange',()=>setTimeout(()=>{measureSheet();if(isMobile())setTy(snapPx[snapName]);map.invalidateSize();},300));

/* Encuadra Andalucía en la parte del mapa que NO tapa la hoja. */
function fitAll(){
  const b=L.latLngBounds(Object.values(POI).map(p=>[p.lat,p.lng]));
  if(!isMobile()){map.fitBounds(b,{padding:[36,36]});return;}
  const tapado=Math.max(0,window.innerHeight-panel.getBoundingClientRect().top);
  map.fitBounds(b,{paddingTopLeft:[26,26],paddingBottomRight:[26,Math.min(tapado+12,window.innerHeight*0.66)]});
}
drawMap();renderPanel();
setTimeout(()=>{measureSheet();snapTo('full',true);map.invalidateSize();fitAll();},220);
loadFX();sbLoad();sbSubscribe();
</script>
</body>
</html>
